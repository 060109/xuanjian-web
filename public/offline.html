<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>离线状态</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b1220; color: #f5f1e8; font-family: system-ui, sans-serif; }
    .container { max-width: 520px; padding: 24px; border-radius: 18px; background: rgba(15, 24, 44, 0.95); box-shadow: 0 22px 50px rgba(0,0,0,0.35); text-align: center; }
    h1 { margin: 0 0 14px; font-size: 1.6rem; }
    p { margin: 0 0 12px; line-height: 1.7; color: #c8c8dc; }
    a { color: #d9b971; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>当前离线</h1>
    <p>应用已缓存静态内容，可离线打开界面。</p>
    <p>部分功能（AI 推演、搜索、历史同步）依赖网络连接或服务器 API，在线时可正常使用。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
